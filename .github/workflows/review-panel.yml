# Review Panel — runs the multi-judge review on a pull request when you ask for it
# (Actions → Review Panel → Run workflow). It no longer runs on every PR; to review any repo
# from an AI app, use the Review Panel MCP server (https://github.com/jgor80/review-panel/tree/main/mcp).
# Posts one comment (updated on each run), labels the PR with the verdict,
# and fails this check on BLOCK.
name: Review Panel

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number to review"
        required: true

concurrency:
  group: review-panel-${{ inputs.pr }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    env:
      PR: ${{ inputs.pr }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: refs/pull/${{ inputs.pr }}/head


      - name: Check for the Anthropic API key
        id: auth
        env:
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          if [ "$HAS_KEY" = "true" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Review Panel skipped: add the ANTHROPIC_API_KEY secret (Settings → Secrets and variables → Actions), then re-run this check."
            echo "Review Panel skipped: the ANTHROPIC_API_KEY secret isn't set for this repo." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: PR details
        id: pr
        if: steps.auth.outputs.ok == 'true'
        run: |
          gh pr view "$PR" --json baseRefName,title,body > pr.json
          echo "base=$(jq -r .baseRefName pr.json)" >> "$GITHUB_OUTPUT"
          git fetch --no-tags origin "$(jq -r .baseRefName pr.json)"
          mkdir -p .review-panel/out

      - name: Run the panel
        id: panel
        if: steps.auth.outputs.ok == 'true'
        uses: anthropics/claude-code-action@v1
        env:
          PANEL_BASE: ${{ steps.pr.outputs.base }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: "https://github.com/jgor80/review-panel.git"
          plugins: "review-panel@jgor80-tools"
          prompt: "/review-panel:review-panel ci pr ${{ env.PR }}"
          claude_args: |
            --max-turns 120
            --allowedTools "Read,Grep,Glob,Write,Agent,Task,TodoWrite,Bash(git:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh api:*),Bash(npm:*),Bash(npx:*),Bash(node:*),Bash(deno:*),Bash(ls:*),Bash(jq:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(grep:*),Bash(rg:*),Bash(find:*),Bash(sed -n:*),Bash(sort:*),Bash(uniq:*),Bash(diff:*),Bash(mkdir:*),Bash(cd:*),Bash(echo:*),Bash(test:*)"

      # Keep the panel's own log next to the report, and list any tool calls it was refused,
      # so a run that ends without a verdict says why
      - name: Panel log
        if: always() && steps.auth.outputs.ok == 'true'
        env:
          EXEC_FILE: ${{ steps.panel.outputs.execution_file }}
        run: |
          mkdir -p .review-panel/out
          F="${EXEC_FILE:-$RUNNER_TEMP/claude-execution-output.json}"
          [ -f "$F" ] || exit 0
          cp "$F" .review-panel/out/execution-log.json
          DENIED=$(jq -r '[.[] | select(.type == "result") | .permission_denials[]? | "\(.tool_name) \(.tool_input.command // .tool_input.file_path // "")"] | .[]' "$F" 2>/dev/null | sort | uniq -c | sort -rn | head -20)
          if [ -n "$DENIED" ]; then
            echo "::warning::The panel was refused some tool calls; see the step summary."
            { echo "### Tool calls the panel was refused"; echo '```'; echo "$DENIED"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Read verdict
        id: v
        if: always() && steps.auth.outputs.ok == 'true'
        run: |
          V=$(tr -d '[:space:]' < .review-panel/out/verdict.txt 2>/dev/null || true)
          echo "verdict=${V:-ERROR}" >> "$GITHUB_OUTPUT"
          echo "Verdict: ${V:-ERROR}" >> "$GITHUB_STEP_SUMMARY"

      - name: Post or update the PR comment
        if: always() && steps.auth.outputs.ok == 'true' && steps.v.outputs.verdict != 'SKIP' && steps.v.outputs.verdict != 'ERROR'
        run: |
          O=.review-panel/out
          {
            echo "<!-- review-panel -->"
            cat "$O/summary.md"
            echo
            echo "<details><summary>Full report</summary>"
            echo
            head -c 50000 "$O/report.md"
            echo
            echo "</details>"
            if [ -s "$O/ledger-rows.md" ]; then
              echo
              echo "<details><summary>Ledger rows</summary>"
              echo
              cat "$O/ledger-rows.md"
              echo
              echo "</details>"
            fi
          } > comment.md
          ID=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
                 --jq '.[] | select(.body | startswith("<!-- review-panel -->")) | .id' | tail -1)
          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$ID" -F body=@comment.md > /dev/null
          else
            gh pr comment "$PR" --body-file comment.md
          fi

      - name: Label the PR with the verdict
        if: always() && steps.auth.outputs.ok == 'true' && steps.v.outputs.verdict != 'ERROR'
        run: |
          gh label create "panel: ship" --color 0e8a16 --force > /dev/null
          gh label create "panel: fix-first" --color fbca04 --force > /dev/null
          gh label create "panel: block" --color b60205 --force > /dev/null
          for l in "panel: ship" "panel: fix-first" "panel: block"; do
            gh pr edit "$PR" --remove-label "$l" > /dev/null 2>&1 || true
          done
          case "${{ steps.v.outputs.verdict }}" in
            SHIP) gh pr edit "$PR" --add-label "panel: ship" ;;
            FIX_FIRST) gh pr edit "$PR" --add-label "panel: fix-first" ;;
            BLOCK) gh pr edit "$PR" --add-label "panel: block" ;;
          esac

      - name: Keep the report
        if: always() && steps.auth.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: review-panel-pr-${{ env.PR }}
          path: .review-panel/out/
          if-no-files-found: ignore

      - name: Pass or fail the check
        if: always() && steps.auth.outputs.ok == 'true'
        run: |
          case "${{ steps.v.outputs.verdict }}" in
            BLOCK) echo "::error::Review Panel verdict is BLOCK — see the PR comment."; exit 1 ;;
            ERROR) echo "::warning::The panel didn't produce a verdict. Check the run log." ;;
            *) echo "Review Panel verdict: ${{ steps.v.outputs.verdict }}" ;;
          esac
